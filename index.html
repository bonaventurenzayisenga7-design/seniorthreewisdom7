<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S3A Graduation App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0b1020;
color:white;
overflow:hidden;
}

/* LOADING SCREEN */
#loader{
position:fixed;
width:100%;
height:100%;
background:#050814;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

.spinner{
width:60px;
height:60px;
border:6px solid #333;
border-top:6px solid #00e5ff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

/* LOGIN SCREEN */
#loginPage{
position:fixed;
width:100%;
height:100%;
background:#0b1020;
display:none;
justify-content:center;
align-items:center;
z-index:9998;
}

.login-box{
background:rgba(255,255,255,.05);
padding:30px;
border-radius:20px;
width:300px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
outline:none;
}

button{
padding:12px;
width:100%;
background:#00e5ff;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

/* APP UI */
#app{
display:none;
height:100vh;
flex-direction:column;
}

header{
padding:20px;
background:#050814;
text-align:center;
}

.container{
flex:1;
overflow:auto;
padding:20px;
}

/* BUTTONS */
.card-btn{
background:rgba(255,255,255,.08);
padding:15px;
margin:10px 0;
border-radius:15px;
cursor:pointer;
transition:.3s;
text-align:center;
}

.card-btn:hover{
background:#00e5ff;
color:black;
}

/* INVITATION POPUP */
#popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.popup-box{
background:white;
color:black;
padding:25px;
border-radius:15px;
width:280px;
text-align:center;
}
</style>

</head>

<body>

<!-- LOADING -->
<div id="loader">
<div class="spinner"></div>
<p style="margin-top:20px;">Loading S3A App...</p>
</div>

<!-- LOGIN -->
<div id="loginPage">
<div class="login-box">
<h2>Student Login</h2>
<input type="text" id="user" placeholder="Enter name">
<input type="password" id="pass" placeholder="Enter ID">
<button onclick="login()">Login</button>
</div>
</div>

<!-- APP -->
<div id="app">

<header>
<h2>S3A Graduation App 🎓</h2>
</header>

<div class="container">

<div class="card-btn" onclick="showInvite()">
🎉 Open Graduation Invitation
</div>

<div class="card-btn">
📸 View Class Gallery
</div>

<div class="card-btn">
🎵 Play Graduation Music
</div>

</div>

</div>

<!-- POPUP -->
<div id="popup">
<div class="popup-box">
<h2>🎓 Graduation 2026</h2>
<p>You are invited to S3A Wisdom High School Graduation Ceremony.</p>
<br>
<button onclick="closeInvite()">Close</button>
</div>
</div>

<script>
/* LOADER */
setTimeout(()=>{
document.getElementById("loader").style.display="none";
document.getElementById("loginPage").style.display="flex";
document.body.style.overflow="auto";
},2500);

/* LOGIN */
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u && p){
document.getElementById("loginPage").style.display="none";
document.getElementById("app").style.display="flex";
}else{
alert("Please enter details");
}
}

/* INVITATION */
function showInvite(){
document.getElementById("popup").style.display="flex";
}

function closeInvite(){
document.getElementById("popup").style.display="none";
}
</script>

</body>
</html>
